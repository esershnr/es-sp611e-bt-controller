[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sp611e-cli"
version = "1.2.0"
description = "SP611E (BanlanX) Bluetooth LE RGB LED controller CLI tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "aiohttp>=3.9.0",
    "bleak>=0.22.0",
    "click>=8.1.0",
    "openrgb-python>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
sp611e = "sp611e_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
